name: Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Formatting
        run: test -z "$(gofmt -l cmd internal migrations web/embed.go)"
      - run: go vet ./...
      - run: go build ./...
