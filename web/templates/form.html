{{define "form"}}
{{template "head" .}}
<a href="/monitors">← К мониторам</a>
<section class="card form-card">
<h1>
{{.Title}}
</h1>
<form action="{{if .Monitor.ID}}/monitors/{{.Monitor.ID}}/edit{{else}}/monitors{{end}}" method="post">

</div>
</form>
</section>
{{template "foot" .}}
{{end}}
