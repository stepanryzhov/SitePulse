name: sitepulse
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
      MONITOR_DB_PASSWORD: ${MONITOR_DB_PASSWORD:-local-monitor-password}
      NOTIFIER_DB_PASSWORD: ${NOTIFIER_DB_PASSWORD:-local-notifier-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic sitepulse.accounts.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic sitepulse.incidents.v1 --partitions 3 --replication-factor 1 --config retention.ms=604800000
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    restart: unless-stopped
  monitor-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sitepulse:local
    command: ["/app/monitor"]
    environment:
      MONITOR_HTTP_ADDR: :8080
      MONITOR_DATABASE_URL: postgres://monitor:${MONITOR_DB_PASSWORD:-local-monitor-password}@postgres:5432/monitor_db?sslmode=disable
      MONITOR_PUBLIC_URL: ${MONITOR_PUBLIC_URL:-http://localhost:8080}
      MONITOR_CHECK_WORKERS: ${MONITOR_CHECK_WORKERS:-20}
      MONITOR_SCHEDULER_INTERVAL: ${MONITOR_SCHEDULER_INTERVAL:-5s}
      MONITOR_CHECK_RETENTION_DAYS: ${MONITOR_CHECK_RETENTION_DAYS:-30}
      KAFKA_BROKERS: kafka:9092
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 40s
    restart: unless-stopped
  notifier-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sitepulse:local
    command: ["/app/notifier"]
    environment:
      NOTIFIER_HTTP_ADDR: :8081
      NOTIFIER_DATABASE_URL: postgres://notifier:${NOTIFIER_DB_PASSWORD:-local-notifier-password}@postgres:5432/notifier_db?sslmode=disable
      MONITOR_PUBLIC_URL: ${MONITOR_PUBLIC_URL:-http://localhost:8080}
      NOTIFIER_DELIVERY_WORKERS: ${NOTIFIER_DELIVERY_WORKERS:-2}
      KAFKA_BROKERS: kafka:9092
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-SitePulse <sitepulse@example.test>}
      SMTP_TLS_MODE: none
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 40s
    restart: unless-stopped
  migrate:
    profiles: [tools]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sitepulse:local
    command: ["/app/migrate"]
    environment:
      MONITOR_DATABASE_URL: postgres://monitor:${MONITOR_DB_PASSWORD:-local-monitor-password}@postgres:5432/monitor_db?sslmode=disable
      NOTIFIER_DATABASE_URL: postgres://notifier:${NOTIFIER_DB_PASSWORD:-local-notifier-password}@postgres:5432/notifier_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
  kafka-data:
